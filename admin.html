<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Painel | Black Burguer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f6f6;background:#090909}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#e7aa36;text-decoration:none}.shell{max-width:1130px;margin:auto;padding:22px 18px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:22px;border-bottom:1px solid #303030}header strong{color:#e7aa36;letter-spacing:.07em}header div{display:flex;gap:15px;align-items:center}h1{font-size:clamp(25px,5vw,38px);margin:30px 0 7px}p{color:#aaa;line-height:1.5}.box{border:1px solid #333;background:#161616;border-radius:18px;padding:24px;margin-top:24px}.login{max-width:440px;margin:9vh auto}.field{display:grid;gap:7px;margin:15px 0;color:#ddd;font-size:15px}.field input,.field select,.field textarea{border:1px solid #3a3a3a;background:#101010;color:white;border-radius:10px;padding:13px;min-height:48px;width:100%;outline:none}.field textarea{min-height:100px;resize:vertical}.field :focus{border-color:#e7aa36}.btn{border:0;border-radius:10px;padding:12px 18px;min-height:46px;font-weight:700;background:#e7aa36;color:#17100a}.btn.secondary{background:#292929;color:#fff}.btn.danger{background:#4c2020;color:#fff}.btn:disabled{opacity:.55;cursor:wait}.bar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}.product{display:flex;gap:13px;align-items:center;background:#171717;border:1px solid #303030;border-radius:15px;padding:12px}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#222}.product div{min-width:0;flex:1}.product strong{display:block;line-height:1.25}.product small{color:#aaa}.product .price{display:block;color:#e7aa36;margin:5px 0;font-weight:700}.product button{background:#303030;color:#fff;border:0;border-radius:8px;padding:8px 12px}.muted{opacity:.5}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:10px;z-index:4}.editor{width:min(580px,100%);max-height:96dvh;overflow:auto;background:#171717;border:1px solid #484848;border-radius:18px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.preview{height:145px;width:145px;object-fit:cover;border-radius:12px;background:#252525}.notice{color:#f2c365;min-height:25px}.hidden{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}.shell{padding:14px 12px 80px}.box{padding:18px}.product{gap:10px}.product img{width:65px;height:65px}.editor{padding:16px}}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stats span{background:#202020;border:1px solid #383838;border-radius:12px;padding:12px 18px;color:#e7aa36;font-weight:700}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.filters input,.filters select{background:#1a1a1a;color:white;border:1px solid #444;border-radius:10px;padding:12px;min-height:46px}.filters input{flex:1;min-width:190px}.product{transition:transform .2s,border-color .2s}.product:hover{transform:translateY(-2px);border-color:#e7aa36}
</style></head><body><div class="shell"><header><strong>BLACK BURGUER · ADMIN</strong><div><a href="/">Ver cardápio</a><button id="logout" class="btn secondary hidden">Sair</button></div></header><section id="login" class="box login"><h1>Entrar no painel</h1><p>Use a conta de administrador autorizada.</p><form id="loginForm"><label class="field">E-mail<input id="email" type="email" autocomplete="username" required></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Entrar</button></form><p id="loginMsg" class="notice" role="status"></p></section><main id="dashboard" class="hidden"><div class="bar"><div><h1>Produtos do cardápio</h1><p>Altere preços e fotos. Suas mudanças entram no site imediatamente.</p></div><button class="btn" id="add">Adicionar produto</button></div><p id="msg" class="notice" role="status"></p><div id="stats" class="stats"></div><div class="filters"><input id="search" placeholder="Buscar produto" aria-label="Buscar produto"><select id="filter" aria-label="Filtrar produtos"><option value="all">Todos</option><option value="active">Visíveis</option><option value="hidden">Ocultos</option><option value="promo">Em promoção</option></select></div><div id="list" class="list"></div></main></div><div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><form id="form" class="editor"><div class="bar"><h2 id="editorTitle">Produto</h2><button type="button" class="btn secondary" id="close">Fechar</button></div><div class="grid"><label class="field">Nome<input name="nome" maxlength="120" required></label><label class="field">Categoria<input name="cat" list="categories" maxlength="70" required><datalist id="categories"><option value="Hambúrgueres"><option value="Promoções"><option value="Combo Duplo"><option value="Combo Família"><option value="Porções"><option value="Bebidas"></datalist></label><label class="field">Preço (R$)<input name="preco" inputmode="decimal" type="number" min="0.01" step="0.01" required></label><label class="field">Preço promocional (R$)<input name="promo_price" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="Opcional"></label></div><label class="field">Descrição<textarea name="description" maxlength="600"></textarea></label><label class="field">Foto do produto<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img class="preview" id="preview" alt="Prévia do produto"><label class="field"><span><input name="active" type="checkbox" checked style="width:auto;min-height:auto"> Produto visível no cardápio</span></label><p id="formMsg" class="notice" role="status"></p><div class="actions"><button class="btn" id="save" type="submit">Salvar produto</button><button class="btn danger hidden" id="remove" type="button">Remover produto</button></div></form></div><script>
const API='https://pxtopfrhmwyfjobuxoac.supabase.co',KEY='sb_publishable_nm3dN40Y2HT45wSf_jUJpw_sCMe9hxA';
const $=s=>document.querySelector(s),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let session=null,rows=[],editing=null,originalImages={};
fetch('/index.html').then(r=>r.text()).then(s=>{const match=s.match(/const IMG=(\{[^\n]+\});/);if(match){originalImages=JSON.parse(match[1]);if(rows.length)load()}}).catch(()=>{});const fmt=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const photo=p=>p.image_data||originalImages[p.img]||originalImages['01']||'';
function store(){if(session)localStorage.setItem('bb_admin_session',JSON.stringify(session));else localStorage.removeItem('bb_admin_session')}
async function request(path,options={}){const headers={apikey:KEY,...options.headers};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;if(options.body&&!headers['Content-Type']&&!(options.body instanceof File))headers['Content-Type']='application/json';let res=await fetch(API+path,{...options,headers});if(res.status===401&&session?.refresh_token&&!path.includes('/auth/v1/token')){await refresh();headers.Authorization='Bearer '+session.access_token;res=await fetch(API+path,{...options,headers})}if(!res.ok){const data=await res.json().catch(()=>({}));throw Error(data.message||data.error_description||data.error||'Falha na operação ('+res.status+')')}return res.status===204?null:res.json()}
async function refresh(){const r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)throw Error('Sessão expirada');session=await r.json();store()}
async function authorize(){const a=await request('/rest/v1/bb_admins?select=user_id&limit=1');if(!a.length)throw Error('Esta conta não tem acesso ao painel.');$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');await load()}
async function load(){rows=await request('/rest/v1/bb_products?select=*&order=position.asc');$('#stats').innerHTML=`<span>${rows.length} produtos</span><span>${rows.filter(p=>p.active).length} visíveis</span><span>${rows.filter(p=>p.promo_price!=null).length} promoções</span>`;renderList()}
function renderList(){const q=$('#search').value.trim().toLocaleLowerCase('pt-BR'),f=$('#filter').value;$('#list').innerHTML=rows.filter(p=>(!q||(p.nome+' '+p.cat).toLocaleLowerCase('pt-BR').includes(q))&&(f==='all'||f==='active'&&p.active||f==='hidden'&&!p.active||f==='promo'&&p.promo_price!=null)).map(p=>`<article class="product ${p.active?'':'muted'}"><img src="${escapeHTML(photo(p))}" alt=""><div><strong>${escapeHTML(p.nome)}</strong><small>${escapeHTML(p.cat)} · ${p.active?'Visível':'Oculto'}</small><span class="price">${fmt(p.promo_price??p.preco)}</span></div><button data-edit="${escapeHTML(p.id)}">Editar</button></article>`).join('')||'<p>Nenhum produto cadastrado.</p>'}
function show(p){editing=p||null;$('#form').reset();$('#formMsg').textContent='';$('#remove').classList.toggle('hidden',!p);$('#editorTitle').textContent=p?'Editar produto':'Novo produto';for(const key of ['nome','cat','preco','promo_price','description'])$('#form').elements[key].value=p?.[key]??'';$('#form').elements.active.checked=p?.active??true;$('#preview').src=p?photo(p):(originalImages['01']||'');$('#modal').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Entrando...';try{session=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});store();await authorize();$('#password').value='';$('#loginMsg').textContent=''}catch(err){session=null;store();$('#loginMsg').textContent=err.message}};
$('#logout').onclick=async()=>{try{await request('/auth/v1/logout',{method:'POST'})}catch{}session=null;store();location.reload()};
$('#search').oninput=renderList;$('#filter').onchange=renderList;$('#list').onclick=e=>{const id=e.target.closest('[data-edit]')?.dataset.edit;if(id)show(rows.find(p=>p.id===id))};$('#add').onclick=()=>show(null);$('#close').onclick=()=>$('#modal').classList.add('hidden');
$('#form').elements.photo.onchange=e=>{const f=e.target.files[0];if(f)$('#preview').src=URL.createObjectURL(f)};
$('#form').onsubmit=async e=>{e.preventDefault();const b=$('#save');b.disabled=true;$('#formMsg').textContent='Salvando...';try{const f=e.currentTarget.elements,price=Number(f.preco.value),promo=f.promo_price.value?Number(f.promo_price.value):null;if(!Number.isFinite(price)||price<=0||promo!==null&&(!Number.isFinite(promo)||promo<=0||promo>=price))throw Error('Informe um preço válido; a promoção deve ser menor que o preço normal.');let image=editing?.image_data||null;const file=f.photo.files[0];if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Envie JPG, PNG ou WebP com até 5 MB.');const path=crypto.randomUUID()+(file.type==='image/png'?'.png':file.type==='image/webp'?'.webp':'.jpg');await request('/storage/v1/object/black-burguer-fotos/'+path,{method:'POST',body:file,headers:{'Content-Type':file.type,'cache-control':'3600'}});image=API+'/storage/v1/object/public/black-burguer-fotos/'+path}
const payload={nome:f.nome.value.trim(),cat:f.cat.value.trim(),preco:price,promo_price:promo,description:f.description.value.trim(),active:f.active.checked,image_data:image,position:editing?.position??(Math.max(-1,...rows.map(p=>p.position??0))+1),img:editing?.img||'01',ar:editing?.ar||'1/1',destaque:editing?.destaque||false};if(!payload.nome||!payload.cat)throw Error('Preencha nome e categoria.');if(editing)await request('/rest/v1/bb_products?id=eq.'+encodeURIComponent(editing.id),{method:'PATCH',body:JSON.stringify(payload)});else await request('/rest/v1/bb_products',{method:'POST',body:JSON.stringify({id:crypto.randomUUID(),...payload})});$('#modal').classList.add('hidden');await load();$('#msg').textContent='Produto salvo. O cardápio já está atualizado.'}catch(err){$('#formMsg').textContent=err.message}finally{b.disabled=false}};
$('#remove').onclick=async()=>{if(!editing||!confirm('Remover definitivamente '+editing.nome+' do cardápio?'))return;$('#remove').disabled=true;try{await request('/rest/v1/bb_products?id=eq.'+encodeURIComponent(editing.id),{method:'DELETE'});$('#modal').classList.add('hidden');await load();$('#msg').textContent='Produto removido.'}catch(err){$('#formMsg').textContent=err.message}finally{$('#remove').disabled=false}};
(async()=>{try{session=JSON.parse(localStorage.getItem('bb_admin_session')||'null');if(!session)return;await refresh();await authorize()}catch{session=null;store()}})();
</script></body></html>
